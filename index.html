<title>Piko Idle Park</title>
<style>
:root{
  --forest:#1f5c3a; --forest-d:#143f28; --leaf:#3f9a5d; --card:#fffdf6;
  --ink:#2a2118; --muted:#7a6d5c; --orange:#f08a24; --orange-d:#c96a0d; --gold:#f6c343; --line:#e8dcc2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#9fd8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);overscroll-behavior:none;overflow:hidden}
#app{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation}

#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;white-space:nowrap;font-size:10px;font-weight:800;background:rgba(255,253,246,.94);color:var(--ink);border-radius:999px;padding:2px 7px;box-shadow:0 1px 4px rgba(0,0,0,.25);will-change:transform}
.lab.lock{background:rgba(70,80,70,.85);color:#fff}
.lab.ok{background:#2aa04a;color:#fff}
.lab.full{background:#d94a3a;color:#fff}
.lab.can::after{content:"▲";position:absolute;right:-9px;top:-9px;width:19px;height:19px;border-radius:50%;background:var(--orange);color:#fff;font-size:10px;display:grid;place-items:center;border:2px solid #fff;animation:bob .7s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.popm{position:absolute;left:0;top:0;font-size:13px;font-weight:800;color:#1f8f3f;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap;will-change:transform,opacity}

#hud{position:absolute;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));background:linear-gradient(180deg,var(--forest),var(--forest-d));color:#fff;border-radius:16px;padding:9px 14px;box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none;max-width:520px;margin:0 auto}
#hud h1{margin:0 0 2px;font-size:11.5px;font-weight:600;letter-spacing:.05em;opacity:.85;display:flex;justify-content:space-between}
#money{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
#stats{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.15);border-radius:999px;padding:3px 7px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}

#fabs{position:absolute;right:10px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;transition:transform .25s}
#fabs.up{transform:translateY(-270px)}
#fabs button{width:48px;height:48px;border-radius:50%;background:var(--card);font-size:22px;box-shadow:0 3px 10px rgba(0,0,0,.28)}

#fabs #f-boost{font-weight:800}
#fabs #f-boost.cd{font-size:12px;color:var(--muted);background:#e9e2cf}
#fabs #f-boost.on{background:var(--orange);animation:bob .4s ease-in-out infinite alternate}
#goal{position:absolute;left:8px;top:calc(102px + env(safe-area-inset-top));background:var(--card);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.25);max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goal.done{background:#2aa04a;color:#fff;animation:bob .5s ease-in-out infinite alternate}
#fabsL{position:absolute;left:10px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;transition:transform .25s}
#fabsL.up{transform:translateY(-270px)}
#fabsL button{width:48px;height:48px;border-radius:50%;background:var(--card);font-size:22px;box-shadow:0 3px 10px rgba(0,0,0,.28)}
#fabs #f-boost.on{font-size:13px;color:#fff}
#f-chest{position:relative}
#f-chest i{position:absolute;right:-3px;top:-3px;background:#d94a3a;color:#fff;font-size:11px;font-style:normal;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px}
#f-chest i:empty{display:none}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.28);padding:12px 14px calc(14px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;max-width:520px;margin:0 auto;max-height:70%;overflow-y:auto}
#sheet.on{transform:none}
#sh-top{display:flex;align-items:center;gap:6px;margin-bottom:8px}
#sh-top b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:auto}
#sh-top button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:700;color:var(--muted)}
#sh-top button.on{background:var(--forest);color:#fff;border-color:var(--forest)}
#sh-top #sh-x{border:0;background:#efe6cf;border-radius:50%;width:30px;height:30px;padding:0;font-size:14px;margin-left:4px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.ico{width:46px;height:46px;border-radius:12px;background:#e9f4e4;display:grid;place-items:center;font-size:26px;flex:none}
.grow{flex:1;min-width:0}
.ttl{font-weight:800;font-size:15px;line-height:1.2}
.sub{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.4}
.note{font-size:11.5px;color:#9a7a1c;margin-top:2px}
.buy{background:var(--orange);color:#fff;border-radius:12px;padding:8px 10px;min-width:108px;font-weight:800;font-size:13px;line-height:1.25;box-shadow:0 3px 0 var(--orange-d);text-align:center;flex:none}
.buy span{display:block;pointer-events:none}
.buy .c{font-weight:700;font-size:11.5px;font-variant-numeric:tabular-nums}
.buy:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--orange-d)}
.buy:disabled{background:#cfc6b2;box-shadow:0 3px 0 #b3a98f;color:#f7f2e4}
.buy.wide{width:100%;padding:11px;font-size:15px}
#sh-foot{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:6px}
#sh-foot button{background:none;color:#b3402d;text-decoration:underline;font-size:12.5px;padding:8px 0}

/* Écran de chargement */
#splash{position:absolute;inset:0;z-index:30;background:linear-gradient(180deg,#3f9a5d,#1f5c3a 55%,#143f28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center;padding:24px;transition:opacity .55s}
#splash.done{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:30px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:splashHop .9s ease-in-out infinite alternate}
@keyframes splashHop{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-14px) rotate(3deg)}}
#splash h2{margin:8px 0 0;font-size:28px;font-weight:800;letter-spacing:.04em}
#splash .sub{font-size:13px;opacity:.8;margin-top:-8px;color:#fff}
#splash .bar{width:min(240px,70%);height:10px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:10px}
#splash .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:999px;transform-origin:left;transform:scaleX(.05);animation:splashBar 2.2s cubic-bezier(.2,.7,.3,1) forwards}
#splash.done .bar i{animation:none;transform:scaleX(1)}
@keyframes splashBar{to{transform:scaleX(.92)}}
#splash .tip{font-size:13px;line-height:1.45;max-width:300px;opacity:.9;min-height:38px}
#splash .foot{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));font-size:11px;opacity:.55}
#modal{position:absolute;inset:0;background:rgba(15,46,29,.7);display:none;place-items:center;padding:24px;z-index:10}
#modal.on{display:grid}
#modal div{background:var(--card);border-radius:20px;padding:22px;text-align:center;max-width:320px;width:100%}
#modal .big{font-size:44px}
#modal h3{margin:6px 0}
#modal p{color:var(--muted);font-size:14px;margin:6px 0 16px;line-height:1.45}
#toast{position:absolute;left:50%;top:calc(146px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:9;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
.chip.warn{background:rgba(240,138,36,.65)}
.chip.bad{background:rgba(217,74,58,.8)}
#topbar{position:absolute;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:2}
#topbar #hud{position:relative;left:auto;right:auto;top:auto;margin:0;max-width:none;width:100%}
#topbar #goal{position:relative;left:auto;top:auto;pointer-events:auto;align-self:flex-start}
#speaker{margin-top:6px;font-size:11.5px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{top:calc(178px + env(safe-area-inset-top))}
#tier{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:8;background:linear-gradient(180deg,#ffe27a,#f6a623);color:#3a2600;border-radius:22px;padding:14px 20px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:88%;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .35s}
#tier.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#tier b{display:block;font-size:19px;line-height:1.2} #tier span{display:block;margin-top:4px;font-size:13px;font-weight:700}
#mg{position:absolute;inset:0;z-index:15;display:none;flex-direction:column;background:linear-gradient(180deg,#27487a,#162844);color:#fff}
#mg.on{display:flex}
#mg-bar{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px}
#mg-bar b{font-size:16px;flex:1} #mg-s{font-weight:800;font-variant-numeric:tabular-nums}
#mg-x{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:15px}
#mg-body{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px calc(20px + env(safe-area-inset-bottom))}
#mg-field{position:absolute;inset:0}
.tg{position:absolute;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.16);font-size:34px;animation:tgIn .18s ease-out}
.tg.gold{background:rgba(255,214,90,.45);box-shadow:0 0 18px #ffd23a}
@keyframes tgIn{from{transform:scale(.3)}to{transform:scale(1)}}
.mgcard{background:var(--card);color:var(--ink);border-radius:20px;padding:20px;text-align:center;max-width:320px;width:100%}
.mgcard h3{margin:4px 0 8px;font-size:20px} .mgcard p{color:var(--muted);font-size:14px;margin:6px 0 14px;line-height:1.5}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(300px,86%);aspect-ratio:1}
.pad{border-radius:22px;opacity:.42;transition:opacity .12s,transform .12s}
.pad.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 24px rgba(255,255,255,.6)}
.wheelbox{position:relative;width:min(300px,82vw);aspect-ratio:1}
.wheel{position:absolute;inset:0;border-radius:50%;border:6px solid #fff;transition:transform 4.4s cubic-bezier(.12,.7,.1,1);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.wheel i{position:absolute;left:50%;top:50%;font-style:normal;font-size:26px;transform-origin:0 0}
.ptr{position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-size:34px;z-index:2}
#visit{pointer-events:auto;align-self:flex-start;background:var(--orange);color:#fff;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#app.visit #fabs, #app.visit #f-arcade, #app.visit #f-friends, #app.visit #goal{display:none}
#fabsL button{width:44px;height:44px;font-size:20px} #fabsL{gap:8px}
#fabs button{width:44px;height:44px;font-size:20px} #fabs{gap:8px}
/* Moins de boutons à l'écran : un menu regroupe tout, la vue a son propre bouton */
#f-chest,#f-season,#f-custom,#f-set,#f-arcade,#f-friends,#f-world{display:none!important}
#fabsL:not(.open) #f-rot,#fabsL:not(.open) #f-tilt,#fabsL:not(.open) #f-home{display:none}
#fabs button,#fabsL button{width:50px;height:50px;font-size:23px}
#f-menu{position:relative;font-weight:800}
#f-menu i{position:absolute;right:-3px;top:-3px;background:#d94a3a;color:#fff;font-size:11px;font-style:normal;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px}
#f-menu i:empty{display:none}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:2px}
#sh-foot .mi{background:#f3ead2;border-radius:16px;padding:12px 4px 10px;font-size:27px;position:relative;line-height:1.1;text-decoration:none;color:var(--ink)}
.mi span{display:block;font-size:12px;font-weight:700;margin-top:5px;color:var(--ink)}
.mi i{position:absolute;right:8px;top:6px;background:#d94a3a;color:#fff;font-size:11px;font-style:normal;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px}
.mi i:empty{display:none}
#joy,#pw{pointer-events:auto;cursor:pointer}
#tuto{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:496px;margin:0 auto;background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:12;display:none}
#tuto.on{display:block}
#tuto b{font-size:17px} #tuto p{margin:6px 0 12px;font-size:14px;line-height:1.5;color:#4a4034}
#tuto div{display:flex;align-items:center;gap:10px} #tu-n{flex:1;text-align:center;font-size:12px;color:var(--muted)}
#tu-skip{background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:8px 4px}
#tuto .buy{min-width:120px}
#app.tuto #fabs,#app.tuto #fabsL{display:none}
</style>
</head>

<script>
'use strict';
/* ================= Réseau de chemins (non linéaire : boucle autour du lac + branches) ================= */
const ISL={rx:1750,rz:1600,cz:40};
// Trois îles, trois parcs : Piko (centre), Piko Racing (est), Piko Aqua (ouest)
const ISLS=[{cx:0,cz:40,rx:1750,rz:1600,top:0x86cc72},{cx:3150,cz:800,rx:900,rz:560,top:0x8ccf78},{cx:-3150,cz:800,rx:900,rz:560,top:0xe6d9a4},{cx:0,cz:2750,rx:900,rz:560,top:0x5f9a6a}];
const DZM=1950, VIA=1250;      // l'île Piko Magie est au sud : même plan que les autres parcs, décalé de DZM ; les voitures passent par le pont sud (x = VIA)
const onLand=(x,z)=>ISLS.some(I=>Math.pow((x-I.cx)/I.rx,2)+Math.pow((z-I.cz)/I.rz,2)<.93);
const F1_COST=2e12, MAGIE_COST=2e10;
const onIsland=(x,z,f)=>Math.pow(x/ISL.rx,2)+Math.pow((z-ISL.cz)/ISL.rz,2)<(f||.74);
const NODES=[], ADJ=[], LINKS=[];
function addNode(x,z){ NODES.push({x,z}); ADJ.push([]); return NODES.length-1; }
function link(a,b){ ADJ[a].push(b); ADJ[b].push(a); LINKS.push([a,b]); }
const nG=addNode(0,700), nP=addNode(0,560);
const RING=[[0,400],[-290,280],[-410,0],[-290,-290],[0,-410],[290,-290],[410,0],[290,280]].map(p=>addNode(p[0],p[1]));
const nN=addNode(0,-560);
link(nG,nP); link(nP,RING[0]); RING.forEach((n,k)=>link(n,RING[(k+1)%8])); link(RING[4],nN);
// Allées secondaires vers l'ouest, l'est et le nord
const nWA=addNode(-560,155), nWB=addNode(-850,160), nEA=addNode(560,155), nEB=addNode(850,160), nTL=addNode(-465,-545), nTR=addNode(465,-545);
link(RING[1],nWA); link(nWA,nWB); link(RING[7],nEA); link(nEA,nEB); link(RING[3],nTL); link(RING[5],nTR);
// Allée de la zone enfants (au sud-est)
const nKA=addNode(520,510), nK=addNode(965,505);

    if(nc<MAXI){
      const sp=slotPos(v.slot,v.park), c=driving?v.car:sp; let y=6.5;
      if(sp.f>0){                                          // les voitures montent aux étages pendant qu'elles entrent / sortent
        const dz=PK[v.park]?PK[v.park].dz:0;
        if(v.st==='driveIn') y=c.x===sp.x?6.5+FH*sp.f*Math.max(0,Math.min(1,(ROAD_IN+dz-c.z)/(ROAD_IN+dz-sp.z))):6.5;

        else y=6.5+FH*sp.f;
      }
      dum.position.set(c.x,y,c.z); dum.rotation.set(0,driving?c.ang:0,0); dum.scale.setScalar(1); dum.updateMatrix(); iCar.setMatrixAt(nc,dum.matrix); iCar.setColorAt(nc,tmpC.setHex(v.ccol));
      dum.position.y=y+7.5; dum.updateMatrix(); iCab.setMatrixAt(nc,dum.matrix); nc++;
    }
    if(driving||v.st==='ride'||np>=MAXI) continue;
    if(v.st==='queue'&&v.qi>=30) continue;
    const walking=v.st!=='queue'&&v.st!=='cashQ', bob=walking?Math.abs(Math.sin(now/90+v.ph))*1.6:0;

/* ================= Caméra : glisser, pincer, tourner ================= */
let vw=1, vh=1;
const cam={x:0,z:640,dist:1500,yaw:0,yawT:0,pitch:.74}, clampPitch=p=>Math.max(.36,Math.min(1.28,p));
let curPR=1;
function applyGfx(){            // Auto : part de la meilleure résolution et la baisse si le jeu rame
  const top=Math.min(window.devicePixelRatio||1, window.matchMedia&&matchMedia('(pointer:coarse)').matches?1.5:2);      // sur téléphone : 1,5 suffit et allège beaucoup curPR = S.gfx==='low' ? Math.min(1,top) : top;
  sun.castShadow=S.gfx!=='low'; renderer.shadowMap.needsUpdate=true; renderer.setPixelRatio(curPR); sceneKey='';
}
function resize(){ vw=cv.clientWidth; vh=cv.clientHeight; renderer.setPixelRatio(curPR); renderer.setSize(vw,vh,false); camera.aspect=vw/vh; camera.updateProjectionMatrix(); }
function clampCam(){ cam.dist=Math.max(260,Math.min(3600,cam.dist)); cam.x=Math.max(-4300,Math.min(4300,cam.x)); cam.z=Math.max(-1100,Math.min(3300,cam.z)); }
function flyTo(x,z,d){ cam.fly={x,z,d:d||cam.dist}; }
function home(){
  const hf=Math.atan(Math.tan(camera.fov*Math.PI/360)*camera.aspect);
  cam.fly=null; cam.x=0; cam.z=600; cam.yawT=0; cam.pitch=.74; cam.dist=Math.min(3000,Math.max(700,400/Math.tan(hf))); clampCam();
}
function applyCam(){
  if(cam.fly){ const f=cam.fly, k=.085; cam.x+=(f.x-cam.x)*k; cam.z+=(f.z-cam.z)*k; cam.dist+=(f.d-cam.dist)*k; if(Math.abs(f.x-cam.x)+Math.abs(f.z-cam.z)<3 && Math.abs(f.d-cam.dist)<6) cam.fly=null; }
  const sz=cam.z>1900&&Math.abs(cam.x)<1950?3:cam.x>1950?1:cam.x<-1950?2:0; if(sz!==shadowZone) setShadowZone(sz);
  cam.yaw+=(cam.yawT-cam.yaw)*.18;
  const c=Math.cos(cam.pitch)*cam.dist;
  camera.position.set(cam.x+Math.sin(cam.yaw)*c, Math.sin(cam.pitch)*cam.dist, cam.z+Math.cos(cam.yaw)*c);
  camera.lookAt(cam.x,0,cam.z);
}
const pts=new Map(); let moved=0, downT=0, pinch=0, pang=0, pmy=0;
function panBy(dx,dy){
  if(S.inv){ dx=-dx; dy=-dy; }            // déplacement inversé : on pousse la caméra dans le sens du doigt
  const s=2*cam.dist*Math.tan(camera.fov*Math.PI/360)/vh, f=dy*s/Math.sin(cam.pitch);
  cam.x-=Math.cos(cam.yaw)*dx*s+Math.sin(cam.yaw)*f; cam.z-=-Math.sin(cam.yaw)*dx*s+Math.cos(cam.yaw)*f; clampCam();
}
cv.addEventListener('pointerdown',e=>{
  cam.fly=null; cv.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){ moved=0; downT=performance.now(); } pinch=0;
});
cv.addEventListener('pointermove',e=>{
  const p=pts.get(e.pointerId); if(!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(pts.size===1){
    moved+=Math.abs(dx)+Math.abs(dy);
    if(e.buttons===2){ cam.yawT-=dx*.006*(S.invR?-1:1); cam.yaw=cam.yawT; cam.pitch=clampPitch(cam.pitch+dy*.004); } else panBy(dx,dy);
  } else if(pts.size===2){
    const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y), ang=Math.atan2(b.y-a.y,b.x-a.x);
    const my=(a.y+b.y)/2;
    if(pinch){ cam.pitch=clampPitch(cam.pitch+(my-pmy)*.005); cam.dist*=pinch/d; let da=ang-pang; if(da>Math.PI) da-=Math.PI*2; if(da<-Math.PI) da+=Math.PI*2; cam.yawT-=da*(S.invR?-1:1); cam.yaw=cam.yawT; clampCam(); }
    pinch=d; pang=ang; pmy=my; moved=99;
  }
});
const pup=e=>{
  if(!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId); pinch=0;
  if(pts.size===0 && e.type==='pointerup' && moved<10 && performance.now()-downT<500) tap(e.clientX,e.clientY);
};
cv.addEventListener('pointerup',pup); cv.addEventListener('pointercancel',pup);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{ e.preventDefault(); cam.fly=null; cam.dist*=Math.exp(e.deltaY*0.0012); clampCam(); },{passive:false});

const ray=new THREE.Raycaster(), ground=new THREE.Plane(new THREE.Vector3(0,1,0),0), hit=new THREE.Vector3(), ndc=new THREE.Vector2();
const zoneLocked=v=>!!(v.zone&&PK[v.zone]&&!S.up[PK[v.zone].open]);
function tapSel(s){
  { const pk=Object.keys(PK).find(p=>PK[p].sheet===s.kind); if(pk&&!S.up[PK[pk].open]) return openSheet({kind:'worlds'}); }
  if(s.kind==='gift') return claimGift();
  if(s.kind==='ven' && RT[s.i].broken>0){ RT[s.i].broken=0; fx(V[s.i].x,V[s.i].h*.6,V[s.i].z,30); sfx('coin'); return toast(`🔧 ${V[s.i].n} réparé !`); }
  openSheet(s);
}
function tap(sx,sy){
  for(const l of labels){ if(l.vis && Math.abs(sx-l.sx)<l.el.offsetWidth/2+6 && Math.abs(sy-l.sy)<20) return tapSel(l.sel); }
  ndc.set(sx/vw*2-1,-(sy/vh)*2+1); ray.setFromCamera(ndc,camera);
  if(!ray.ray.intersectPlane(ground,hit)) return closeSheet();
  const x=hit.x, z=hit.z;
  for(let i=0;i<V.length;i++) if(Math.hypot(x-V[i].x,z-V[i].z)<V[i].r+8) return tapSel({kind:'ven',i});
  for(const p in PK){ const K=PK[p]; if((Math.abs(x-K.cx)<385 && z>850+K.dz && z<1070+K.dz)||(Math.abs(x-K.gx)<200 && z>690+K.dz && z<=850+K.dz)) return tapSel({kind:K.sheet}); }

  if(Math.abs(x)<440 && z>850 && z<1065) return openSheet({kind:'park'});
  if(Math.abs(x)<570 && z>1225 && z<1450) return openSheet({kind:'park'});
  if(Math.hypot(x-POWER.x,z-POWER.z)<POWER.r+10) return openSheet({kind:'power'});
  if(Math.abs(x)<160 && z>680 && z<=850) return openSheet({kind:'gate'});
  if(Math.hypot(x-OFFICE.x,z-OFFICE.z)<OFFICE.r+10) return openSheet({kind:'office'});


  if(Math.hypot(x-MAINT.x,z-MAINT.z)<MAINT.r+10) return openSheet({kind:'maint'});
  if(Math.hypot(x-HOTEL.x,z-HOTEL.z)<HOTEL.r+10) return openSheet({kind:'hotel'});
  for(let i=0;i<DECO.length;i++) if(Math.hypot(x-DECO[i][0],z-DECO[i][1])<34) return openSheet({kind:'deco',i});

  closeSheet();
}

let AC=null, musicG, sfxG, ambG, noiseBuf; const lastS={};
function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  AC=new C(); musicG=AC.createGain(); sfxG=AC.createGain(); musicG.connect(AC.destination); sfxG.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  // Brouhaha du parc : bruit filtré dont le volume suit le nombre de visiteurs
  const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true; const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=850; f.Q.value=.5;
  ambG=AC.createGain(); ambG.gain.value=0; src.connect(f); f.connect(ambG); ambG.connect(sfxG); src.start();
  applyAudio(); setInterval(musicTick,150);
}
function applyAudio(){ if(!AC) return; musicG.gain.value=S.music?.5:0; sfxG.gain.value=S.sfx?.6:0; }
function tone(dest,type,f0,f1,t0,dur,vol){
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t0); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.015); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g); g.connect(dest); o.start(t0); o.stop(t0+dur+.05);
}
function noiseB(t,dur,f0,f1,vol){
  const n=AC.createBufferSource(); n.buffer=noiseBuf; const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.06); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  n.connect(f); f.connect(g); g.connect(sfxG); n.start(t); n.stop(t+dur+.05);
}
function sfx(name,x,z){
  if(!AC||!S.sfx||AC.state!=='running') return;
  const t=AC.currentTime, gap={ding:.35,flush:1.5,scream:1.1,coin:.08,fanfare:.5,plane:1}[name];
  if(t-(lastS[name]||-9)<gap) return;
  let v=1;                                  // plus fort quand la caméra est proche
  if(x!==undefined){ v=Math.max(0,1-Math.hypot(x-cam.x,z-cam.z)/(cam.dist*.7+250)); if(v<.05) return; }
  lastS[name]=t;
  if(name==='ding') tone(sfxG,'sine',1568,1568,t,.25,.12*v);
  else if(name==='coin'){ tone(sfxG,'triangle',988,988,t,.09,.22); tone(sfxG,'triangle',1319,1319,t+.08,.3,.22); }
  else if(name==='fanfare') [523,659,784,1047].forEach((f,k)=>tone(sfxG,'square',f,f,t+k*.11,k===3?.5:.14,.1));
  else if(name==='scream'){ for(let k=0;k<3;k++){ const f=780+k*150+Math.random()*90; tone(sfxG,'sawtooth',f,f*.55,t+k*.07,.9,.045*v); } }
  else if(name==='flush') noiseB(t,1.4,3200,220,.35*v);
  else if(name==='plane'){ tone(sfxG,'sawtooth',118,96,t,2.4,.05); tone(sfxG,'sawtooth',121,99,t,2.4,.05); }
}
const MEL=[[76,79,84],[74,79,83],[72,76,81],[81,79,77],[76,79,76],[74,71,74],[77,81,79],[76,74,72]], BASS=[48,43,45,41,48,43,41,48],
      CH=[[60,64,67],[59,62,67],[60,64,69],[60,65,69],[60,64,67],[59,62,67],[60,65,69],[60,64,67]], BEAT=.38, hz=m=>440*Math.pow(2,(m-69)/12);
let mT=0, mI=0;
function musicTick(){
  if(!AC||AC.state!=='running'||!S.music){ mT=0; return; }
  const now=AC.currentTime; if(mT<now) mT=now+.05;
  while(mT<now+.4){
    const bar=(mI/3|0)%8, b=mI%3;
    tone(musicG,'triangle',hz(MEL[bar][b]),hz(MEL[bar][b]),mT,BEAT*.95,.16);
    if(b===0) tone(musicG,'sine',hz(BASS[bar]),hz(BASS[bar]),mT,BEAT*1.2,.22); else CH[bar].forEach(n=>tone(musicG,'sine',hz(n),hz(n),mT,BEAT*.5,.05));
    mT+=BEAT; mI++;
  }
}

function parseCard(txt){
  try{ let c=String(txt).trim(); const i=c.indexOf('#ami='); if(i>=0) c=decodeURIComponent(c.slice(i+5));
    const d=JSON.parse(decodeURIComponent(escape(atob(c)))); if(!d||!Array.isArray(d.lv)) return null;

  {t:'😀 La satisfaction', d:"Files trop longues, pas de toilettes, pannes : les visiteurs repartent fâchés et moins de monde vient. Touche le 😀 en haut de l'écran pour voir exactement ce qui plaît et ce qui fâche.", c:[0,300,1300]},
  {t:'⚡ La centrale', d:"Chaque bâtiment consomme de l'électricité. Si la centrale ne produit pas assez, tous les manèges ralentissent. Surveille le compteur ⚡ en haut.", c:[1180,850,800]},
  {t:'☰ Le menu', d:"Le bouton ☰ regroupe tout : coffres, mini-jeux, amis, personnalisation, saison et réglages. Le bouton 🎥 règle la vue. La pastille en haut te donne toujours le prochain objectif.", c:[0,600,1300]},
  {t:'🌍 Quatre îles', d:"Ton parc est sur l'île Piko. Trois autres îles t'attendent, chacune avec son parc : Piko Aqua à l'ouest, Piko Magie au sud, Piko Racing à l'est. La caméra te les montre. On les ouvre depuis le menu ☰, bouton Îles.", c:[0,1300,3600], tour:[[-3150,700,2200],[0,2650,2200],[3150,700,2200],[0,1300,3600]]},
  {t:'🚀 À toi de jouer !', d:"Commence par améliorer la Chenille Rigolote et agrandir le parking. Tu peux revoir ce tutoriel à tout moment dans le menu ☰.", c:[0,600,1300]},
];
let tuI=-1;
function showTuto(){ const s=TUTO[tuI]; $('#tu-t').textContent=s.t; $('#tu-d').textContent=s.d; $('#tu-n').textContent=`${tuI+1} / ${TUTO.length}`; $('#tu-next').textContent=tuI===TUTO.length-1?"C'est parti !":'Suivant'; cam.yawT=0; cam.pitch=.74; flyTo(s.c[0],s.c[1],s.c[2]);
  if(s.tour){ const me=tuI; s.tour.forEach((q,k)=>setTimeout(()=>{ if(tuI===me) flyTo(q[0],q[1],q[2]); },1500+k*2300)); } }
function startTuto(){ closeSheet(); tuI=0; $('#tuto').classList.add('on'); $('#app').classList.add('tuto'); showTuto(); }
function endTuto(){ tuI=-1; $('#tuto').classList.remove('on'); $('#app').classList.remove('tuto'); S.tuto=true; save(); home(); }
$('#tu-next').onclick=()=>{ if(tuI>=TUTO.length-1) endTuto(); else { tuI++; showTuto(); } };
$('#tu-skip').onclick=endTuto;

/* ================= Mini-jeux (salle d'arcade) ================= */
const MG={
  tir:{e:'🌰', n:'Tir aux noisettes', d:"Touche les noisettes avant qu'elles disparaissent. 20 secondes !", cd:180},
  memo:{e:'🧠', n:'Mémo Piko', d:'Répète la suite de couleurs : plus tu vas loin, plus tu gagnes.', cd:240},
  roue:{e:'🎡', n:'Roue de la fortune', d:'Un tour gratuit toutes les 30 minutes, ou 1 sablier pour rejouer.', cd:1800},
};
let mgOpen=false, mgTimer=null, mgStop=null, mgLock=false;
const mgLeft=k=>Math.max(0,((S.mg[k]||0)+MG[k].cd*1000-Date.now())/1000);
const mgReward=sec=>Math.max(60,S.rate*sec);
function arcadeRow(k){
  const m=MG[k];
  return {ico:m.e, name:()=>m.n, sub:()=>m.d, note:()=>mgLeft(k)>0?`Prochaine partie gratuite dans ${fmtTime(mgLeft(k))}`:'Disponible !',
    btn:()=>{ const l=mgLeft(k); if(l<=0) return {label:'Jouer', cost:'gratuit', ok:true}; return k==='roue'?{label:'Rejouer', cost:'1 sablier', ok:S.glass>0}:{label:'Patienter', cost:fmtTime(l), ok:false}; },
    act:()=>{ if(mgLeft(k)>0){ if(k==='roue'&&S.glass>0) S.glass--; else return; } startMg(k); }};
}
function startMg(k){
  closeSheet(); mgOpen=true; mgLock=false; $('#mg').classList.add('on'); $('#mg-t').textContent=MG[k].e+' '+MG[k].n; $('#mg-s').textContent='';
  const body=$('#mg-body'); body.innerHTML=''; ({tir:mgTir,memo:mgMemo,roue:mgRoue})[k](body);
}
function mgClose(){ if(mgLock) return; if(mgStop){ mgStop(); mgStop=null; } clearInterval(mgTimer); $('#mg').classList.remove('on'); mgOpen=false; }
$('#mg-x').onclick=mgClose;
function mgResult(k,title,txt,reward,extra){
  S.mg[k]=Date.now(); mgLock=false; const body=$('#mg-body'), parts=[reward>0?`+${fmt(reward)} €`:null, extra?extra.label:null].filter(Boolean).join(' · ');
  body.innerHTML=`<div class="mgcard"><div style="font-size:44px">${MG[k].e}</div><h3>${title}</h3><p>${txt}<br><b style="color:var(--leaf);font-size:19px">${parts}</b></p><button class="buy wide" id="mg-ok">Récupérer</button></div>`;
  $('#mg-ok').onclick=()=>{ if(reward>0) bonus(reward); if(extra) extra.apply(); sfx('coin'); mgClose(); toast(`${MG[k].e} ${parts}`,2800); save(); };
}
function mgTir(body){
  body.innerHTML='<div id="mg-field"></div>'; const F=$('#mg-field'); let score=0, t=20, sp=620, acc=0;
  const upd=()=>{ $('#mg-s').textContent=`⏱ ${Math.ceil(t)} s · 🌰 ${score}`; }; upd();
  const spawn=()=>{ const b=document.createElement('button'), gold=Math.random()<.14; b.className='tg'+(gold?' gold':''); b.textContent=gold?'🥜':'🌰';
    b.style.left=(6+Math.random()*78)+'%'; b.style.top=(8+Math.random()*78)+'%';
    b.onpointerdown=e=>{ e.stopPropagation(); score+=gold?3:1; upd(); sfx('ding'); b.remove(); };
    F.appendChild(b); setTimeout(()=>b.remove(),gold?900:1200); };
  mgTimer=setInterval(()=>{ t-=.1; acc+=100; if(acc>=sp){ acc=0; spawn(); sp=Math.max(330,sp-8); } upd();
    if(t<=0){ clearInterval(mgTimer); S.best.tir=Math.max(S.best.tir||0,score); mgResult('tir',score>=20?"Tireur d'élite !":'Pas mal !',`Tu as ramassé ${score} points.`,mgReward(2*score),score>=25?{label:'+1 coffre 🎁',apply:()=>{ S.chests++; }}:null); } },100);
}
function mgMemo(body){
  const COL=['#e0531f','#3b82c4','#2aa876','#f6c343'], FR=[262,330,392,523];
  body.innerHTML=`<div class="pads">${COL.map((c,i)=>`<button class="pad" data-i="${i}" style="background:${c}"></button>`).join('')}</div><p id="mg-msg" style="margin-top:16px;font-weight:700">Regarde bien…</p>`;
  const pads=[...body.querySelectorAll('.pad')], msg=$('#mg-msg'); let seq=[], pos=0, accept=false, dead=false;
  const beep=i=>{ if(AC&&S.sfx&&AC.state==='running') tone(sfxG,'sine',FR[i],FR[i],AC.currentTime,.28,.3); };
  const lit=(i,ms)=>{ pads[i].classList.add('lit'); beep(i); setTimeout(()=>pads[i].classList.remove('lit'),ms); };
  const play=()=>{ if(!mgOpen||dead) return; accept=false; pos=0; seq.push(Math.random()*4|0); $('#mg-s').textContent='Manche '+seq.length; msg.textContent='Regarde bien…'; let k=0;
    const tid=setInterval(()=>{ if(dead){ clearInterval(tid); return; } if(k>=seq.length){ clearInterval(tid); accept=true; msg.textContent='À toi !'; return; } lit(seq[k],380); k++; },650);
    mgStop=()=>{ dead=true; clearInterval(tid); }; };
  pads.forEach(p=>{ p.onpointerdown=()=>{ if(!accept) return; const i=+p.dataset.i; lit(i,200);
    if(i!==seq[pos]){ accept=false; const rounds=seq.length-1;
      S.best.memo=Math.max(S.best.memo||0,rounds);
      mgResult('memo',rounds>=6?'Mémoire de hérisson !':'Raté !',`Tu as réussi ${rounds} manche${rounds>1?'s':''}.`,mgReward(8*rounds),rounds>=7?{label:'+1 sablier ⏳',apply:()=>{ S.glass++; }}:null); return; }
    pos++; if(pos>=seq.length){ accept=false; msg.textContent='Bravo !'; setTimeout(play,800); } }; });
  setTimeout(play,600);
}
function mgRoue(body){
  const P=[['💰','20 s de revenus',24,()=>mgReward(20)],['💰','1 min de revenus',20,()=>mgReward(60)],['🎁','un coffre',12,0],['💰','4 min de revenus',12,()=>mgReward(240)],['⏳','un sablier',8,0],['💰','40 s de revenus',14,()=>mgReward(40)],['🎉','une parade (recettes ×2 pendant 1 min)',6,0],['💎','le JACKPOT : 10 min de revenus',4,()=>mgReward(600)]];
  const COL=['#f6c343','#e0569b','#3b82c4','#2aa876','#8e5bd0','#ff8c42','#e0531f','#3fb7c9'];
  body.innerHTML=`<div class="wheelbox"><div class="ptr">🔻</div><div class="wheel" id="wheel" style="background:conic-gradient(${COL.map((c,i)=>`${c} ${i*45}deg ${(i+1)*45}deg`).join(',')})">${P.map((p,i)=>`<i style="transform:rotate(${i*45+22.5}deg) translateY(-98px) rotate(${-(i*45+22.5)}deg) translate(-50%,-50%)">${p[0]}</i>`).join('')}</div></div><button class="buy wide" id="spin" style="max-width:260px;margin-top:26px">Lancer la roue</button>`;
  $('#spin').onclick=()=>{ $('#spin').disabled=true; mgLock=true; let r=Math.random()*100, i=0; for(;i<7;i++){ if(r<P[i][2]) break; r-=P[i][2]; }
    const A=i*45+22.5; $('#wheel').style.transform=`rotate(${360*5+360-A}deg)`;
    setTimeout(()=>{ const p=P[i]; let reward=0, extra=null;
      if(p[3]) reward=p[3](); else if(i===2) extra={label:'+1 coffre 🎁',apply:()=>{ S.chests++; }}; else if(i===4) extra={label:'+1 sablier ⏳',apply:()=>{ S.glass++; }}; else extra={label:'Parade lancée 🎉',apply:()=>{ S.boostEnd=Date.now()+60000; }};
      mgResult('roue','Résultat : '+p[0],`Tu gagnes ${p[1]} !`,reward,extra); },4700); };
}

/* ================= Boucle ================= */
let prev=performance.now(), saveT=0;
let fAvg=1/60, fT=0, fN=0;
function frame(now){
  let dt=(now-prev)/1000; prev=now;
  if(S.gfx==='auto' && dt<.25){ fAvg=fAvg*.96+dt*.04; fT+=dt;
    if(fT>3){ fT=0; if(fAvg>1/38 && curPR>.76){ curPR=Math.max(.75,curPR-.25); renderer.setPixelRatio(curPR); fAvg=1/60; } } }
  if(dt>3) offline(dt,dt<30);
  else { dt=Math.min(dt,0.25); step(dt); if(turboOn()) step(dt); }
  saveT+=dt; if(saveT>5){ saveT=0; save(); }
  const d2=Math.min(dt,.25); tickGift(d2,now); tickEvents(d2);
  S.chestT+=d2; if(S.chestT>=CHEST_EVERY){ S.chestT=0; if(S.chests<5){ S.chests++; toast('🎁 Un coffre gratuit t\'attend !',3000); } } if(boostOn()&&Math.random()<d2*5){ const n=NODES[RING[Math.random()*8|0]]; fx(n.x,30,n.z,14); }
  if(!mgOpen){ applyCam(); syncScene(now); syncAgents(now); syncConf(d2); renderer.render(scene,camera); if(fN%2===0) syncLabels(); syncPops(Math.min(dt,.25)); }
  if(fN++%3===0){ hud(); updateSheet(); }      // textes de l'interface : 20 fois par seconde suffisent
  requestAnimationFrame(frame);
}
window.addEventListener('resize',()=>{ resize(); clampCam(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
window.addEventListener('pagehide',save);

if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
load(); resetSim(); applyGfx(); resize(); home(); cam.yaw=cam.yawT;
// Les objets qui ne bougent jamais n'ont plus leur matrice recalculée à chaque image
{ flutter.forEach(f=>f.g.userData.dyn=1); falls.forEach(f=>f.m.userData.dyn=1);
  vg.forEach(g=>{ g.root.userData.dyn='self'; g.marq.userData.dyn='self'; g.inner.userData.dyn=1; g.smoke.userData.dyn=1; g.star.userData.dyn=1; g.crown.userData.dyn=1; g.halo.userData.dyn=1; g.beams.forEach(b=>b.userData.dyn=1); });
  [mascot,balloon,giftM,selRing,hotelRoof,officeTower,...techM,...boothMeshes].forEach(o=>o.userData.dyn=1);
  // Fusion des objets fixes : files d'attente, chantiers, enseignes, drapeaux, décors, dalles de parking, décor posé au sol
  vg.forEach(g=>{ mergeTree(g.built); mergeTree(g.site); mergeTree(g.marq); g.stages.forEach(s=>mergeTree(s));
    g.fb=[0,1,2].map(k=>{ const b=new THREE.Group(); g.root.add(b); g.flags.slice([0,3,7][k],[3,7,11][k]).forEach(fl=>b.add(fl)); mergeTree(b); return b; }); });
  [deckP,deckR,deckA,deckM,deckB,deckC].forEach(d=>d.floors.forEach(fl=>mergeTree(fl))); mergeTree(aquaDeco); mergeTree(magieDeco); shopG.userData.dyn='self'; decoSpots.forEach(s=>s.items.forEach(it=>mergeTree(it)));
  mergeTree(scene,true);
  const freeze=o=>{ if(o.userData.dyn===1) return; if(o.userData.dyn!=='self'){ o.updateMatrix(); o.matrixAutoUpdate=false; } o.children.forEach(freeze); };
  scene.children.forEach(freeze); }
{ const away=(Date.now()-S.last)/1000; if(away>=30 && S.total>0) offline(away,false); }
// Récompense quotidienne : un cadeau par jour, de plus en plus généreux sur 7 jours d'affilée
{ const dk=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(), today=dk(new Date()), y=new Date(); y.setDate(y.getDate()-1);
  if(S.day!==today){
    S.streak = S.day===dk(y) ? S.streak+1 : 1; S.day=today;
    const n=[1,1,2,1,2,2,3][(S.streak-1)%7], cash=Math.max(50,S.rate*120*((S.streak-1)%7+1)); S.chests+=n; S.glass++; S.money+=cash; S.run+=cash; S.total+=cash; save();
    modal('🎁','Cadeau du jour',`Jour ${S.streak} d'affilée<br><b style="color:var(--leaf);font-size:18px">+${n} coffre${n>1?'s':''} · +1 ⏳ · +${fmt(cash)} €</b><br><small>Reviens demain : le 7e jour offre 3 coffres.</small>`,'Merci !');
  } }
if(location.hash.indexOf('#ami=')===0){ const fr=parseCard(location.hash); try{ history.replaceState(null,'',location.pathname); }catch(e){}
  if(fr) modal('👥','Nouvel ami',`Ajouter <b>${fr.n}</b> à tes amis ?<br><small>Tu pourras visiter son parc et comparer vos scores.</small>`,'Ajouter',()=>{ addFriend(fr); openSheet({kind:'friends'}); }); }
S.seen=true; (function tryTuto(){ if(S.tuto||visiting) return; if($('#modal').classList.contains('on')||$('#splash')) return setTimeout(tryTuto,900); startTuto(); })();
requestAnimationFrame(frame);
// Écran de chargement : on le retire une fois le parc affiché (au moins 1,6 s à l'écran)
requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(()=>{ const sp=$('#splash'); sp.classList.add('done'); setTimeout(()=>sp.remove(),650); }, Math.max(0,1600-performance.now()))));
</script>
